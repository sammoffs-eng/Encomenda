<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Áreas</title>

<style>
body { font-family: Arial; background:#eef2f7; margin:0; }
header { background:#1e293b; color:#fff; text-align:center; padding:15px; }

.container { padding:15px; }

.card {
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input, select, button {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing: border-box;
}

button { background:#22c55e; color:white; border:none; cursor: pointer; font-weight: bold; }
.add-btn { background:#3b82f6; }
.saida-btn { background:#f59e0b; }
.backup-btn { background:#6366f1; }

.tag {
  display:inline-block;
  background:#3b82f6;
  color:white;
  padding:5px 8px;
  border-radius:8px;
  margin:3px;
  font-size:12px;
  cursor:pointer;
}

/* Estilo para a seleção de múltiplas áreas */
.areas-container {
  margin-top: 10px;
  padding: 5px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #f8fafc;
}
.area-checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px;
  cursor: pointer;
}
.area-checkbox input {
  width: auto;
  margin: 0;
}

.reserva-ativa { background:#d1fae5; }
.reserva-finalizada { background:#fecaca; color: #7f1d1d; }

.item { padding:10px; border-radius:10px; margin-bottom:10px; }

.modal {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
}

.modal-content {
  background:#fff;
  margin:10% auto;
  padding:20px;
  width:90%;
  max-width: 400px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>Controle de Áreas</header>

<div class="container">

<div class="card">
<h3>Nova Reserva</h3>

<input type="text" id="apartamento" placeholder="Apartamento">

<label style="font-size: 13px; color: #475569; margin-top: 10px; display: block; font-weight: bold;">Selecione as Áreas:</label>
<div class="areas-container">
  <label class="area-checkbox"><input type="checkbox" name="locais" value="Academia"> Academia</label>
  <label class="area-checkbox"><input type="checkbox" name="locais" value="Churrasqueira"> Churrasqueira</label>
  <label class="area-checkbox"><input type="checkbox" name="locais" value="Quadra"> Quadra</label>
  <label class="area-checkbox"><input type="checkbox" name="locais" value="Piscina"> Piscina</label>
</div>

<input type="text" id="novoConvidado" placeholder="Nome do convidado">
<button class="add-btn" type="button" onclick="addConvidado()">Adicionar Convidado</button>

<div id="tags" style="margin-top: 10px; min-height: 20px;"></div>

<input type="datetime-local" id="entrada">

<button type="button" onclick="salvar()">Registrar Entrada</button>
<button class="backup-btn" type="button" onclick="exportarDados()">Baixar Backup</button>
</div>

<div class="card">
<h3>Filtrar por Data</h3>
<input type="date" id="filtroData" onchange="filtrarPorData()">
<button type="button" class="add-btn" onclick="limparFiltro()">Limpar Filtro</button>
</div>

<div class="card">
<h3>Registros</h3>
<div id="lista"></div>
</div>

</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Editar Convidados</h3>

    <input type="text" id="editInput" placeholder="Nome do convidado">
    <button class="add-btn" type="button" onclick="addModal()">Adicionar</button>

    <div id="modalTags" style="margin-top: 10px; min-height: 20px;"></div>

    <button type="button" onclick="salvarModal()">Salvar</button>
    <button type="button" style="background:#64748b;" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
let db;
let convidadosTemp = [];
let modalLista = [];
let editIdGlobal = null;
let dataFiltroAtual = "";

/* INICIALIZAÇÃO DO INDEXEDDB */
window.onload = () => {
    resetDataHora();
    
    const request = indexedDB.open("ControleAreasOriginalDB", 1);

    request.onerror = (event) => {
        alert("Erro ao abrir banco de dados.");
    };

    request.onsuccess = (event) => {
        db = event.target.result;
        listar();
    };

    request.onupgradeneeded = (event) => {
        const database = event.target.result;
        database.createObjectStore("registros", { keyPath: "id" });
    };
};

function resetDataHora() {
    const agora = new Date();
    agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
    document.getElementById('entrada').value = agora.toISOString().slice(0, 16);
}

function renderTags() {
  document.getElementById("tags").innerHTML = convidadosTemp.map((n, i) =>
    `<span class="tag" onclick="removerConvidado(${i})">${n} ❌</span>`
  ).join("");
}

function addConvidado() {
  const input = document.getElementById("novoConvidado");
  const nome = input.value.trim();

  if (!nome) return;
  
  if (convidadosTemp.length > 0 && convidadosTemp.length % 10 === 0) {
    alert("Aviso: Você já adicionou " + convidadosTemp.length + " convidados nesta lista.");
  }

  if (convidadosTemp.length >= 50) return alert("Limite máximo de segurança atingido (50 convidados)!");

  convidadosTemp.push(nome);
  input.value = "";
  renderTags();
}

function removerConvidado(i) {
  convidadosTemp.splice(i, 1);
  renderTags();
}

/* SALVAMENTO COM MÚLTIPLAS ÁREAS EM UMA ÚNICA RESERVA */
function salvar() {
  const apto = document.getElementById("apartamento").value.trim();
  const entrada = document.getElementById("entrada").value;
  
  // Captura todas as áreas que foram marcadas (checkboxes)
  const checkboxes = document.querySelectorAll('input[name="locais"]:checked');
  const locaisSelecionados = [];
  checkboxes.forEach(cb => locaisSelecionados.push(cb.value));

  if (!apto || locaisSelecionados.length === 0 || !entrada) {
    alert("Preencha o apartamento, a data e selecione ao menos uma área!");
    return;
  }

  const novoRegistro = {
    id: Date.now(),
    apartamento: apto,
    local: locaisSelecionados.join(", "), // Junta as áreas por vírgula (Ex: "Academia, Piscina")
    convidados: [...convidadosTemp],
    entrada,
    saida: null
  };

  const transacao = db.transaction(["registros"], "readwrite");
  const store = transacao.objectStore("registros");
  const request = store.add(novoRegistro);

  request.onsuccess = () => {
    convidadosTemp = [];
    renderTags();
    limpar();
    resetDataHora();
    listar();
    alert("✅ Reserva registrada com sucesso!");
  };

  request.onerror = (e) => {
    alert("Erro ao salvar no banco de dados.");
  };
}

/* MODAL DE EDIÇÃO */
function abrirModal(id) {
  editIdGlobal = id;
  
  const transacao = db.transaction(["registros"], "readonly");
  const store = transacao.objectStore("registros");
  const request = store.get(id);

  request.onsuccess = () => {
    const registro = request.result;
    if (registro) {
      modalLista = [...(registro.convidados || [])];
      renderModal();
      document.getElementById("modal").style.display = "block";
    }
  };
}

function renderModal() {
  document.getElementById("modalTags").innerHTML = modalLista.map((n, i) =>
    `<span class="tag" onclick="removerModal(${i})">${n} ❌</span>`
  ).join("");
}

function addModal() {
  const input = document.getElementById("editInput");
  const nome = input.value.trim();

  if (!nome) return;

  if (modalLista.length > 0 && modalLista.length % 10 === 0) {
    alert("Aviso: Esta lista já possui " + modalLista.length + " convidados.");
  }

  if (modalLista.length >= 50) return alert("Limite máximo de segurança atingido (50 convidados)!");

  modalLista.push(nome);
  input.value = "";
  renderModal();
}

function removerModal(i) {
  modalLista.splice(i, 1);
  renderModal();
}

function salvarModal() {
  const transacao = db.transaction(["registros"], "readwrite");
  const store = transacao.objectStore("registros");
  const getRequest = store.get(editIdGlobal);

  getRequest.onsuccess = () => {
    const registro = getRequest.result;
    if (registro) {
      registro.convidados = [...modalLista];
      
      const putRequest = store.put(registro);
      putRequest.onsuccess = () => {
        fecharModal();
        listar();
      };
    }
  };
}

function fecharModal() {
  document.getElementById("modal").style.display = "none";
}

/* REGISTRAR SAÍDA */
function registrarSaida(id) {
  const transacao = db.transaction(["registros"], "readwrite");
  const store = transacao.objectStore("registros");
  const getRequest = store.get(id);

  getRequest.onsuccess = () => {
    const registro = getRequest.result;
    if (registro) {
      registro.saida = new Date().toISOString();
      
      const putRequest = store.put(registro);
      putRequest.onsuccess = () => {
        listar();
      };
    }
  };
}

/* LISTAR E FILTRAR */
function listar() {
  const transacao = db.transaction(["registros"], "readonly");
  const store = transacao.objectStore("registros");
  const request = store.getAll();

  request.onsuccess = () => {
    let dadosBanco = request.result || [];

    if (dataFiltroAtual) {
        dadosBanco = dadosBanco.filter(item => {
            if (!item.entrada) return false;
            return item.entrada.split("T")[0] === dataFiltroAtual;
        });
    }

    renderLista(dadosBanco);
  };
}

function renderLista(listaDados) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  const ordenados = [...listaDados].sort((a, b) => {
    if (a.saida === null && b.saida !== null) return -1;
    if (a.saida !== null && b.saida === null) return 1;
    return b.id - a.id;
  });

  if(ordenados.length === 0) {
    lista.innerHTML = "<p style='text-align:center;color:#666;'>Nenhum registro encontrado.</p>";
    return;
  }

  ordenados.forEach((item)=>{
    const classe = item.saida ? "reserva-finalizada" : "reserva-ativa";

    const tags = (item.convidados || []).map(n =>
      `<span class="tag">${n}</span>`
    ).join("");

    lista.innerHTML += `
      <div class="item ${classe}">
        <b>Apto:</b> ${item.apartamento}<br>
        <b>Locais selecionados:</b> <span style="color:#1e3a8a; font-weight:bold;">${item.local}</span><br>
        <b>Convidados (${item.convidados.length}):</b><br>
        <div style="margin: 5px 0;">${tags || "Nenhum"}</div>
        <b>Entrada:</b> ${new Date(item.entrada).toLocaleString()}<br>
        ${item.saida ? `<b>Saída:</b> ${new Date(item.saida).toLocaleString()}<br>` : ""}

        ${!item.saida ? `
          <button class="saida-btn" style="margin-top:5px; width:auto; padding: 6px 12px;" onclick="registrarSaida(${item.id})">Saída</button>
          <button class="add-btn" style="margin-top:5px; width:auto; padding: 6px 12px;" onclick="abrirModal(${item.id})">Editar</button>
        ` : ""}
      </div>
    `;
  });
}

/* FILTRO POR DATA */
function filtrarPorData() {
  dataFiltroAtual = document.getElementById("filtroData").value;
  listar();
}

function limparFiltro() {
  document.getElementById("filtroData").value = "";
  dataFiltroAtual = "";
  listar();
}

/* LIMPAR FORMULÁRIO */
function limpar() {
  document.getElementById("apartamento").value="";
  document.getElementById("novoConvidado").value="";
  
  // Desmarca todas as caixas de seleção após o envio bem-sucedido
  const checkboxes = document.querySelectorAll('input[name="locais"]');
  checkboxes.forEach(cb => cb.checked = false);
}

/* EXPORTAR BACKUP */
function exportarDados() {
    const transacao = db.transaction(["registros"], "readonly");
    const store = transacao.objectStore("registros");
    const request = store.getAll();

    request.onsuccess = () => {
        const dadosSalvar = request.result;
        if (!dadosSalvar || dadosSalvar.length === 0) return alert("Sem dados.");
        const blob = new Blob([JSON.stringify(dadosSalvar, null, 2)], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "backup_areas.txt";
        link.click();
    };
}
</script>

</body>
</html>
